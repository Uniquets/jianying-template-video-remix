interface:
  display_name: "Jianying Template Video Remix"
  short_description: "Remix Jianying templates into new styled drafts"
  default_prompt: "Use $jianying-template-video-remix. First complete the environment confirmation checklist (template draft name, media folder, topic/script, new draft name, voice source, historical writing style source), explain what will be reused from the template and that historical draft scripts are read by default for style imitation when no final script is provided, wait for my 确认开始, then execute. If no ready voiceover file is provided, ask me to choose Jianying/template TTS or FishAPI voice cloning. If you write a new narration, show it to me for confirmation before Jianying TTS, FishAPI, or remix."

policy:
  allow_implicit_invocation: true
